plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods { minecraft_ue_bridge { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation sourceSets.client.output
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
